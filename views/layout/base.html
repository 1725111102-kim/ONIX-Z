<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ONIX Z{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <nav class="navbar">
    <a href="{{ url_for('store.index') }}" class="logo">
      <span class="logo-badge">Z</span>
      ONIX Z
    </a>
    <div class="nav-links">
      <a href="{{ url_for('store.index') }}">Catálogo</a>
      <a href="{{ url_for('admin.login') }}">Admin</a>
    </div>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <footer>© 2026 ONIX Z — Todos los derechos reservados</footer>

</body>
</html>
